name: CI Business Logic

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Lint (Ruff)
        run: python -m ruff check src tests
      - name: Pruebas y cobertura (>=80%)
        run: python -m pytest -v --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=80
      - name: Build (compilar src)
        run: python -m compileall src
      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov
